<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood meter</title>
    <link rel="stylesheet" href="pok.css">
</head>
<body>
    <main class="container">
        <h1 class="title">What is your mood?</h1>
        <p id="description">Rate your mood here:</p>
        <div class="button-container">
            <button class="emoji-btn" id="happy-btn" aria-label="happy-btn">
                <span>😄</span><span class="count">0/10</span>
            </button>
            <button class="emoji-btn" id="sad-btn" aria-label="sad-btn">
                <span>😢</span><span class="count">0/10</span>
            </button>
            <button class="emoji-btn" id="angry-btn" aria-label="angry-btn">
                <span>😠</span><span class="count">0/10</span>
            </button>
            <button class="emoji-btn" id="shock-btn" aria-label="shock-btn">
                <span>😲</span><span class="count">0/10</span>
            </button>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
