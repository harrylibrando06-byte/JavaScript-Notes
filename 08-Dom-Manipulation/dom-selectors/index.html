<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>DOM Manipulation</title>
</head>
<body>
    <section class="pages">
        <h1>Art supplies</h1>
        <ul>
            <li class="item-list">6b pencils <button class="fav-icon">&#9825</button></li>
            <li class="item-list">5ply yarn <button class="fav-icon">&#9825</button></li>
            <li class="item-list">Color pencil<button class="fav-icon">&#9825</button></li>
        </ul>
        <script src="./script.js" defer></script>
    </section>    
    
    <section class="instruments">
        <h1>Students instruments</h1>

        <select name="" id="select-instrument" class="select-instrument">
                <option value="all">All</option>
                <option value="woodwinds">Woodwind</option>
                <option value="brass">Brass</option>
                <option value="percussion">Percussion</option>
        </select>

        <div class="instruments-container">
            <!-- will inject the instruments  -->
        </div>
    </section>

    <section class="rTCcount">
        <h1>Real time Character Counter </h1>
        <textarea id="textArea" rows="5" cols="40" placeholder="Type something..."></textarea>
        <p class="timeP">Character Count: <span class="char-count">0</span>/50</p>
    </section>

    <section class="lightBoxSection">
        <style>
            :root {
            --bg-dark: #0f0f1a;
            --bg-light: #1a1a2e;
            --overlay: rgba(10, 10, 20, 0.85);
            --text: #e8e8f0;
            --text-muted: #8888a0;
            --accent: #f5a623;
            --accent-hover: #ffc04d;
            --border: #2a2a40;
            }

            .lightBoxSection {
                background-color: var(--bg-dark);
            }

            .lightBoxSection > img {
                height: auto;
                width: 3rem;
            }
        </style>

        <h1>Landscape paintings</h1>

        <a>
            <img src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" alt="painting">
        </a>
        <a>
            <img src="./734509020446201519.jpg" alt="painting">
        </a>
        <a>
            <img src="./739012620151586113.jpg" alt="painting">
        </a>

    </section>
</body>
</html>
